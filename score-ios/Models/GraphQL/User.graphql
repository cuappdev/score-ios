mutation SignupUser($idToken: String!) {
  signupUser(idToken: $idToken) {
    accessToken
    refreshToken
    user {
      id
      email
      name
      favoriteTeams {
        sport
        gender
      }
      bookmarkedHighlightIds
    }
  }
}

mutation LoginUser($idToken: String!) {
  loginUser(idToken: $idToken) {
    accessToken
    refreshToken
    user {
      id
      email
      name
      favoriteTeams {
        sport
        gender
      }
      bookmarkedHighlightIds
    }
  }
}

mutation RefreshAccessToken {
  refreshAccessToken {
    newAccessToken
  }
}

mutation LogoutUser {
  logoutUser {
    __typename
  }
}

mutation DeleteUser {
  deleteUser {
    __typename
  }
}
